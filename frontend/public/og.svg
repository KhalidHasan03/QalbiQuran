<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="QalbiQuran — read, listen and reflect on the Holy Qur'an">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e" />
      <stop offset="1" stop-color="#06120e" />
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d9c48a" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <text x="80" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#f5f0e6">
    QalbiQuran
  </text>
  <text x="84" y="372" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#d9c48a">
    Read · Listen · Reflect
  </text>
  <text x="84" y="440" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#9db8ac">
    Qur'an in Arabic, English &amp; Bangla with streaks and progress
  </text>
  <text x="80" y="560" font-family="Georgia, serif" font-size="56" fill="#d9c48a">
    ﷽
  </text>
</svg>
